name: Production Deployment

on:
  push:
    branches: [ "main" ]

env:
  # Değişkenler
  IMAGE_NAME: "pricesyncpro-frontend"
  CONTAINER_NAME: "pricesyncpro-frontend"
  PORT: "3000"
  PROJECT_PATH: "/root/pricesyncpro" # Sunucudaki proje klasörünün yolu (bunu güncellemelisin)

jobs:
  # 1. AŞAMA: Test ve Build Kontrolü (GitHub Sunucularında Çalışır)
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Lint Kontrolü
        run: npm run lint --if-present

      # Eğer testlerin varsa burayı açabilirsin
      # - name: Testleri Çalıştır
      #   run: npm run test --if-present

      - name: Build Denemesi (Hata var mı kontrol et)
        run: npm run build

  # 2. AŞAMA: Sunucuya Dağıtım (Kendi VPS'ine Bağlanır)
  deploy-to-server:
    needs: test-and-build # Test aşaması başarılı olursa çalışır
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile Sunucuya Bağlan ve Deploy Et
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     # 185.136.206.100
          username: ${{ secrets.SERVER_USER }} # root
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # SSH Private Key
          port: 22
          script_stop: true # Hata olursa durdur
          script: |
            # Değişkenleri Tanımla
            IMAGE_NAME="pricesyncpro-frontend"
            CONTAINER_NAME="pricesyncpro-frontend"
            PORT="3000"
            PROJECT_DIR="/root/pricesyncpro" # Projenin sunucudaki yeri

            echo "🚀 Deployment Başlıyor..."

            # 1. Proje klasörüne git (Yoksa klonla)
            if [ -d "$PROJECT_DIR" ]; then
              cd $PROJECT_DIR
              echo "⬇️  Güncel kod çekiliyor..."
              git pull origin main
            else
              echo "📂 Proje klasörü bulunamadı, klonlanıyor..."
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
              cd $PROJECT_DIR
            fi

            # 2. Yeni Image Oluştur (Podman)
            echo "🏗️  Container Image oluşturuluyor..."
            sudo podman build -t $IMAGE_NAME .

            # 3. Eski Container'ı Durdur ve Sil
            echo "🛑 Eski container durduruluyor..."
            if sudo podman ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
                sudo podman stop $CONTAINER_NAME
                sudo podman rm $CONTAINER_NAME
            fi

            # 4. Yeni Container'ı Başlat
            echo "▶️  Yeni container başlatılıyor..."
            sudo podman run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p $PORT:3000 \
              $IMAGE_NAME

            # 5. Temizlik
            echo "🧹 Gereksiz image'lar temizleniyor..."
            sudo podman image prune -f

            echo "✅ Deployment Başarıyla Tamamlandı!"
