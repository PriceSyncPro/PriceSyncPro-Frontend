name: Production Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Manuel tetikleme butonu için

env:
  IMAGE_NAME: "pricesyncpro-frontend"
  CONTAINER_NAME: "pricesyncpro-frontend"
  PORT: "3000"
  PROJECT_PATH: "/root/pricesyncpro"

jobs:
  # 1. AŞAMA: Test ve Build (Senin Sunucundaki Runner'da Çalışır)
  test-and-build:
    runs-on: self-hosted # <--- DEĞİŞİKLİK BURADA
    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ayarla
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Lint Kontrolü
        run: npm run lint --if-present

      - name: Build Denemesi
        run: npm run build

  # 2. AŞAMA: Deploy (Yine Runner üzerinden Root olarak SSH atar)
  deploy-to-server:
    needs: test-and-build
    runs-on: self-hosted # <--- DEĞİŞİKLİK BURADA
    steps:
      # Runner kullanıcısı kısıtlı yetkiye (runner) sahip olduğu için,
      # işlemleri ROOT olarak yapmak adına kendi kendine SSH atması en güvenli yoldur.
      - name: SSH ile Root Olarak Deploy Et
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}     # Sunucunun kendi IP'si
          username: ${{ secrets.SERVER_USER }} # root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            # Değişkenler
            IMAGE_NAME="pricesyncpro-frontend"
            CONTAINER_NAME="pricesyncpro-frontend"
            PORT="3000"
            PROJECT_DIR="/root/pricesyncpro"

            echo "🚀 Deployment Başlıyor (Self-Hosted Runner)..."

            # 1. Klasör Kontrolü
            if [ -d "$PROJECT_DIR" ]; then
              cd $PROJECT_DIR
              echo "⬇️  Kod güncelleniyor..."
              git pull origin main
            else
              echo "📂 Klasör yok, klonlanıyor..."
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
              cd $PROJECT_DIR
            fi

            # 2. Image Oluştur
            echo "🏗️  Podman build..."
            podman build -t $IMAGE_NAME .

            # 3. Eski Container Temizliği
            if podman ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
                echo "🛑 Eski container durduruluyor..."
                podman stop $CONTAINER_NAME
                podman rm $CONTAINER_NAME
            fi

            # 4. Yeni Container Başlat
            echo "▶️  Yeni container başlatılıyor..."
            podman run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p $PORT:3000 \
              $IMAGE_NAME

            # 5. Temizlik
            podman image prune -f
            echo "✅ İşlem Tamam!"
